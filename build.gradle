plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "4.0.0.2929"
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

sonarqube {
	properties {
		property "sonar.projectKey", "sb-security-base"
		property "sonar.host.url", "http://sonarqube:9000"
	}
}

group = 'com.zennitech'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// JDBC y Lambda
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'com.amazonaws.serverless:aws-serverless-java-container-springboot3:2.1.1'
	// Otros
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'ch.qos.logback:logback-classic'

	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	// Source: https://mvnrepository.com/artifact/com.itextpdf/itextpdf
	implementation("com.itextpdf:itextpdf:5.0.6")
	// Source: https://mvnrepository.com/artifact/com.itextpdf/itext-asian
	implementation("com.itextpdf:itext-asian:5.2.0")

}

bootJar {
	enabled = true
}

jar {
	enabled = false
}


tasks.named('test') {
	useJUnitPlatform()
	enabled = false
}
// .\gradlew clean build